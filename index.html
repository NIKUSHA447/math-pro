<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>მათემატიკის ტესტები - ნიკა ნანავა</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Noto+Sans+Georgian:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="logo-area">
            <h1>MATH LAB</h1>
            <div class="hieroglyph-text">
                დამზადებულია: <span class="neon-name">ნიკა ნანავა</span>
            </div>
        </div>
    </header>

    <main>
        <section id="welcome-screen">
            <h2>აირჩიე კლასი:</h2>
            <div class="class-buttons">
                <button onclick="startQuiz(6)">მე-6 კლასი</button>
                <button onclick="startQuiz(7)">მე-7 კლასი</button>
                <button onclick="startQuiz(8)">მე-8 კლასი</button>
                <button onclick="startQuiz(9)">მე-9 კლასი</button>
            </div>
        </section>

        <section id="quiz-container">
            </section>

        <section id="certificate" style="display: none;">
            <div id="cert-text"></div>
            <button onclick="location.reload()" class="retry-btn">თავიდან დაწყება</button>
        </section>
    </main>

    <div class="bg-animation"></div>

    <script src="script.js"></script>
</body>
</html>
