<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>Math Quiz - Nika Nanava</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <section id="login-screen" class="screen active">
            <h1>MATH QUEST</h1>
            <input type="text" id="user-name" placeholder="სახელი გვარი">
            <button onclick="goToClasses()">დაწყება</button>
        </section>

        <section id="class-screen" class="screen">
            <h2>აირჩიე კლასი</h2>
            <button onclick="startLevel(6)">მე-6 კლასი</button>
            <button onclick="startLevel(7)">მე-7 კლასი</button>
            <button onclick="startLevel(8)">მე-8 კლასი</button>
            <button onclick="startLevel(9)">მე-9 კლასი</button>
        </section>

        <section id="quiz-screen" class="screen">
            <div id="round-info"></div>
            <h3 id="question-text"></h3>
            <div id="options-grid"></div>
        </section>

        <section id="finish-screen" class="screen">
            <div id="cert-box" class="diploma">
                <h1 id="cert-type"></h1>
                <p>გადაეცემა</p>
                <h2 id="final-name" class="cert-name"></h2>
                <div id="final-score"></div>
                <div class="author-footer">დამზადებულია: ნიკა ნანავა</div>
            </div>
            <button onclick="location.reload()">თავიდან</button>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
